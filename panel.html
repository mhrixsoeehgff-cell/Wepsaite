<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Converter</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS ডিজাইন */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0d0a1a; /* গা dark ় ব্যাকগ্রাউন্ড */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            background-image: radial-gradient(circle at 20% 50%, #2a0a4a 0%, transparent 50%),
                              radial-gradient(circle at 80% 20%, #1a0a3a 0%, transparent 50%);
        }

        .container {
            width: 420px;
            background: rgba(20, 10, 40, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(180, 70, 255, 0.4);
            box-shadow: 0 0 25px rgba(150, 0, 255, 0.3);
        }

        .header {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #c084fc;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* সোশ্যাল লগইন বাটন */
        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .social-btn:hover {
            background: rgba(180, 70, 255, 0.4);
            transform: scale(1.1);
        }

        /* ইনপুট ফিল্ড */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: #a78bfa;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(180, 70, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #c084fc;
            box-shadow: 0 0 10px rgba(192, 132, 252, 0.3);
        }

        /* ডুয়াল বক্স (নিকনেম/রিজন) */
        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .row .input-group {
            flex: 1;
            margin-bottom: 0;
        }

        /* কনভার্ট বাটন */
        .convert-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #7c3aed, #a855f7);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
        }

        .convert-btn:hover {
            background: linear-gradient(90deg, #6d28d9, #9333ea);
            box-shadow: 0 0 25px rgba(124, 58, 237, 0.8);
        }

        /* টোকেন বক্স */
        .token-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(180, 70, 255, 0.3);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            position: relative;
        }

        .token-box .label {
            font-size: 10px;
            color: #a78bfa;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .token-box textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #d8b4fe;
            font-size: 12px;
            resize: none;
            outline: none;
            font-family: monospace;
            height: 50px;
            word-break: break-all;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(180, 70, 255, 0.3);
            border: none;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .copy-btn:hover {
            background: rgba(180, 70, 255, 0.6);
        }

        /* রেসপন্সিভ */
        @media (max-width: 480px) {
            .container {
                width: 95%;
                padding: 15px;
            }
            .social-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">Select Provider & Login</div>

    <!-- সোশ্যাল লগইন বাটন -->
    <div class="social-login">
        <div class="social-btn"><i class="fab fa-google"></i></div>
        <div class="social-btn"><i class="fab fa-facebook-f"></i></div>
        <div class="social-btn"><i class="fab fa-apple"></i></div>
        <div class="social-btn"><i class="fab fa-x-twitter"></i></div>
        <div class="social-btn"><i class="fab fa-vk"></i></div>
    </div>

    <!-- URL ইনপুট -->
    <div class="input-group">
        <label>Website URL</label>
        <input type="text" id="urlInput" placeholder="https://discord.com/..." value="https://discord.com/...">
    </div>

    <!-- নিকনেম ও রিজন -->
    <div class="row">
        <div class="input-group">
            <label>Nickname</label>
            <input type="text" id="nickname" placeholder="#JOKER">
        </div>
        <div class="input-group">
            <label>Region</label>
            <input type="text" id="region" placeholder="IND">
        </div>
    </div>

    <!-- আইডি ও লেভেল -->
    <div class="row">
        <div class="input-group">
            <label>Account ID</label>
            <input type="text" id="accountId" placeholder="2915480735">
        </div>
        <div class="input-group">
            <label>Level</label>
            <input type="text" id="level" placeholder="43">
        </div>
    </div>

    <!-- এক্সট্রাক্টেড অ্যাক্সেস টোকেন -->
    <div class="token-box">
        <div class="label">Extracted Access Token</div>
        <textarea id="accessToken" readonly>8410928987480a4a867904e1d45c41148a25054ec62b6c89f5cffa3645779ec03</textarea>
        <button class="copy-btn" onclick="copyToken('accessToken')">Copy Token</button>
    </div>

    <!-- JWT টোকেন -->
    <div class="token-box">
        <div class="label">JWT Token</div>
        <textarea id="jwtToken" readonly>eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjE0... (এখানে JWT থাকবে)</textarea>
        <button class="copy-btn" onclick="copyToken('jwtToken')">Copy JWT</button>
    </div>

    <!-- কনভার্ট বাটন -->
    <button class="convert-btn" onclick="convertToken()">Convert to JWT</button>
</div>

<script>
    // কপি ফাংশন
    function copyToken(elementId) {
        const textarea = document.getElementById(elementId);
        textarea.select();
        document.execCommand('copy');
        alert('Copied!');
    }

    // টোকেন কনভার্ট ফাংশন (API কল)
    async function convertToken() {
        const accessToken = document.getElementById('accessToken').value.trim();
        if (!accessToken) {
            alert('Please enter an Access Token first!');
            return;
        }

        // এখানে আপনার API URL বসান
        const API_URL = 'https://your-api-url.com/convert'; 

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: accessToken })
            });

            const data = await response.json();

            if (data.jwt) {
                document.getElementById('jwtToken').value = data.jwt;
            } else {
                alert('Conversion failed: ' + (data.error || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('API Error: Could not connect to the server.');
        }
    }
</script>

</body>
</html>
